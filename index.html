<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adom Kiki — Follow the Music</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,600;1,300&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>"
    />

    <script defer src="/_vercel/insights/script.js"></script>
    <script>
      window.si =
        window.si ||
        function () {
          (window.siq = window.siq || []).push(arguments);
        };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
  </head>
  <body>
    <!-- Ambient noise grain overlay -->
    <div class="grain"></div>

    <!-- Floating music notes background -->
    <div class="notes-bg" aria-hidden="true">
      <span>♩</span><span>♪</span><span>♫</span><span>♬</span> <span>♩</span
      ><span>♪</span><span>♫</span><span>♬</span> <span>♩</span><span>♪</span>
    </div>

    <div class="page-container">
      <!-- Vinyl record hero section -->
      <div class="hero">
        <div class="vinyl-wrap">
          <div class="vinyl">
            <div class="vinyl-grooves"></div>
            <div class="vinyl-label">
              <img src="Adom_Kiki.jpeg" alt="Adom Kiki" class="profile-img" />
            </div>
            <div class="vinyl-shine"></div>
          </div>
          <!-- Spinning arm -->
          <div class="tonearm">
            <div class="tonearm-head"></div>
          </div>
        </div>

        <div class="hero-text">
          <p class="eyebrow">🎵 Now Playing</p>
          <h1 class="artist-name">Adom<br /><em>Kiki</em></h1>
          <p class="tagline">Hit follow — the music never stops.</p>
        </div>
      </div>

      <!-- EQ bars decoration -->
      <div class="eq-bars" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
      </div>

      <p class="section-label">— Stream &amp; Follow —</p>

      <!-- Links -->
      <div class="links-wrapper">
        <a
          href="https://www.youtube.com/@adomkiki8979"
          class="link-card youtube delay-05"
        >
          <div class="card-glow"></div>
          <div class="icon-wrap">
            <i class="fa-brands fa-youtube"></i>
          </div>
          <div class="text-content">
            <span class="platform-name">YouTube</span>
            <span class="action-text">Watch &amp; Subscribe</span>
          </div>
          <div class="play-btn"><i class="fa-solid fa-play"></i></div>
        </a>

        <a
          href="https://www.facebook.com/share/17f1qsQ6aL/"
          class="link-card facebook delay-10"
        >
          <div class="card-glow"></div>
          <div class="icon-wrap">
            <i class="fa-brands fa-facebook-f"></i>
          </div>
          <div class="text-content">
            <span class="platform-name">Facebook</span>
            <span class="action-text">Like &amp; Follow</span>
          </div>
          <div class="play-btn"><i class="fa-solid fa-play"></i></div>
        </a>

        <a
          href="https://www.instagram.com/adomkiki"
          class="link-card instagram delay-15"
        >
          <div class="card-glow"></div>
          <div class="icon-wrap">
            <i class="fa-brands fa-instagram"></i>
          </div>
          <div class="text-content">
            <span class="platform-name">Instagram</span>
            <span class="action-text">Follow for Reels &amp; Stories</span>
          </div>
          <div class="play-btn"><i class="fa-solid fa-play"></i></div>
        </a>

        <a
          href="https://chat.whatsapp.com/GwfDMm0iWdqBauoVRA50Z9"
          class="link-card whatsapp delay-20"
        >
          <div class="card-glow"></div>
          <div class="icon-wrap">
            <i class="fa-brands fa-whatsapp"></i>
          </div>
          <div class="text-content">
            <span class="platform-name">WhatsApp</span>
            <span class="action-text">Join the Community</span>
          </div>
          <div class="play-btn"><i class="fa-solid fa-play"></i></div>
        </a>

        <a
          href="https://www.tiktok.com/@adom_kiki"
          class="link-card tiktok delay-25"
        >
          <div class="card-glow"></div>
          <div class="icon-wrap">
            <i class="fa-brands fa-tiktok"></i>
          </div>
          <div class="text-content">
            <span class="platform-name">TikTok</span>
            <span class="action-text">Dance to the Beat</span>
          </div>
          <div class="play-btn"><i class="fa-solid fa-play"></i></div>
        </a>
      </div>

      <footer class="footer">
        <div class="waveform" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <p>&copy; <span id="year"></span> Adom Kiki. All rights reserved.</p>
      </footer>
    </div>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
